[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firefly-aem-pipeline"
version = "0.1.0"
description = "Generate assets with Adobe Firefly Services and upload to AEM Assets as a Cloud Service"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
firefly-aem = "firefly_aem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firefly_aem"]
